<rect x="457.0" y="329.0" width="46" height="22" rx="4" fill="#fff"/>
<text x="480.0" y="345.0" font-size="17" text-anchor="middle" font-weight="400" fill="#17293a">Heat</text>
<path d="M240.0 322.0 Q240.0 260.0 240.0 198.0" fill="none" stroke="#476174" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="185.5" y="234.0" width="109" height="22" rx="4" fill="#fff"/>
<text x="240.0" y="250.0" font-size="17" text-anchor="middle" font-weight="400" fill="#17293a">Temperature</text>
<rect x="124.0" y="132.0" width="232" height="66" rx="10" fill="#f2f7fb" stroke="#476174" stroke-width="2"/>
<text x="240" y="160.0" font-size="22" text-anchor="middle" font-weight="650" fill="#17293a">Sensor</text>
<text x="240" y="184.0" font-size="18" text-anchor="middle" font-weight="400" fill="#17293a">Measure temperature</text>
<rect x="604.0" y="132.0" width="232" height="66" rx="10" fill="#f2f7fb" stroke="#476174" stroke-width="2"/>
<text x="720" y="160.0" font-size="22" text-anchor="middle" font-weight="650" fill="#17293a">Controller</text>
<text x="720" y="184.0" font-size="15" text-anchor="middle" font-weight="400" fill="#17293a">Determine heater state</text>
<rect x="604.0" y="322.0" width="232" height="66" rx="10" fill="#f2f7fb" stroke="#476174" stroke-width="2"/>
<text x="720" y="350.0" font-size="22" text-anchor="middle" font-weight="650" fill="#17293a">Actuator</text>
<text x="720" y="374.0" font-size="18" text-anchor="middle" font-weight="400" fill="#17293a">Switch the heater</text>
<rect x="124.0" y="322.0" width="232" height="66" rx="10" fill="#f2f7fb" stroke="#476174" stroke-width="2"/>
