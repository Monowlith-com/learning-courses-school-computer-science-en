<text x="480.0" y="155.0" font-size="17" text-anchor="middle" font-weight="400" fill="#17293a">Reading</text>
<path d="M720.0 198.0 Q720.0 260.0 720.0 322.0" fill="none" stroke="#476174" stroke-width="2.4" marker-end="url(#arrow)"/>
