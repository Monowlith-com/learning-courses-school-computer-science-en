<text x="185.33333333333334" y="320" font-size="21" text-anchor="middle" font-weight="400" fill="#17293a">Insert 2</text>
<path d="M332.6666666666667 291 v45" fill="none" stroke="#476174" stroke-width="2.4"/>
<text x="480.0" y="320" font-size="21" text-anchor="middle" font-weight="400" fill="#17293a">[2, 3, 5, 7]</text>
<path d="M627.3333333333334 291 v45" fill="none" stroke="#476174" stroke-width="2.4"/>
<text x="774.6666666666667" y="320" font-size="21" text-anchor="middle" font-weight="400" fill="#17293a">[ ]</text>
