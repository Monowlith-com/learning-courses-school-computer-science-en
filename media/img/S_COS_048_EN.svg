<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 370" width="700" height="370" role="img" aria-labelledby="desc"><title id="desc">Directed graph with cycle A–B–D–A and isolated F. DFS A B D E C; BFS A B C D E.</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#42627a"/></marker></defs><rect width="700" height="370" fill="white"/><g font-family="Arial, sans-serif"><text x="350" y="34" font-size="23" text-anchor="middle" font-weight="bold" fill="#182d40">Depth-first and breadth-first search</text><line x1="149.0" y1="120.0" x2="250.0" y2="120.0" stroke="#42627a" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="125.0" y1="144.0" x2="125.0" y2="190.0" stroke="#42627a" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="304.0" y1="120.0" x2="405.0" y2="120.0" stroke="#42627a" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="149.0" y1="220.0" x2="405.0" y2="220.0" stroke="#42627a" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="435.0" y1="144.0" x2="435.0" y2="190.0" stroke="#42627a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 420 100 Q 280 22 153 95" fill="none" stroke="#42627a" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="125" cy="120" r="23" fill="#e8f1f8" stroke="#42627a" stroke-width="2"/><text x="125" y="126" font-size="17" text-anchor="middle" font-weight="normal" fill="#182d40">A</text><circle cx="280" cy="120" r="23" fill="#e8f1f8" stroke="#42627a" stroke-width="2"/><text x="280" y="126" font-size="17" text-anchor="middle" font-weight="normal" fill="#182d40">B</text><circle cx="125" cy="220" r="23" fill="#e8f1f8" stroke="#42627a" stroke-width="2"/><text x="125" y="226" font-size="17" text-anchor="middle" font-weight="normal" fill="#182d40">C</text><circle cx="435" cy="120" r="23" fill="#e8f1f8" stroke="#42627a" stroke-width="2"/><text x="435" y="126" font-size="17" text-anchor="middle" font-weight="normal" fill="#182d40">D</text><circle cx="435" cy="220" r="23" fill="#e8f1f8" stroke="#42627a" stroke-width="2"/><text x="435" y="226" font-size="17" text-anchor="middle" font-weight="normal" fill="#182d40">E</text><circle cx="600" cy="175" r="23" fill="#f0f0f0" stroke="#42627a" stroke-width="2"/><text x="600" y="181" font-size="17" text-anchor="middle" font-weight="normal" fill="#182d40">F</text><text x="350" y="300" font-size="19" text-anchor="middle" font-weight="bold" fill="#182d40">DFS: A → B → D → E → C</text><text x="350" y="334" font-size="19" text-anchor="middle" font-weight="bold" fill="#182d40">BFS: A → B → C → D → E</text></g></svg>
