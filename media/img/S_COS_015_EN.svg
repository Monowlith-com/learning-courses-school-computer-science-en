<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 325" width="960" height="325" role="img" aria-labelledby="title description" xml:lang="en">
<title id="title">Steps in an HTTPS request</title>
<desc id="description">DNS resolves library.example. The browser and service then establish a protected connection. The service answers GET /rooms with 200 and the page.</desc>
<defs><marker id="arrow" orient="auto" markerWidth="8" markerHeight="7" refX="7.4" refY="3.5"><path d="M0 0 L8 3.5 L0 7 Z" fill="#476174"/></marker></defs>
<rect width="960" height="325" fill="#fff"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="38" y="57" font-size="31" text-anchor="start" font-weight="700" fill="#17293a">Steps in an HTTPS request</text>
<path d="M38 77 H922" stroke="#bac5cf" stroke-width="1.4"/>
<rect x="38.0" y="119.0" width="197.0" height="122" rx="10" fill="#f2f7fb" stroke="#476174" stroke-width="2"/>
<text x="136.5" y="175.0" font-size="22" text-anchor="middle" font-weight="650" fill="#17293a">DNS query</text>
<text x="136.5" y="199.0" font-size="18" text-anchor="middle" font-weight="400" fill="#17293a">library.example</text>
<path d="M239.0 180 H262.0" fill="none" stroke="#476174" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="267.0" y="119.0" width="197.0" height="122" rx="10" fill="#f2f7fb" stroke="#476174" stroke-width="2"/>
<text x="365.5" y="175.0" font-size="20" text-anchor="middle" font-weight="650" fill="#17293a">TLS connection</text>
<text x="365.5" y="199.0" font-size="13" text-anchor="middle" font-weight="400" fill="#17293a">verify server identity</text>
<path d="M468.0 180 H491.0" fill="none" stroke="#476174" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="496.0" y="119.0" width="197.0" height="122" rx="10" fill="#f2f7fb" stroke="#476174" stroke-width="2"/>
<text x="594.5" y="175.0" font-size="22" text-anchor="middle" font-weight="650" fill="#17293a">HTTP request</text>
<text x="594.5" y="199.0" font-size="18" text-anchor="middle" font-weight="400" fill="#17293a">GET /rooms</text>
<path d="M697.0 180 H720.0" fill="none" stroke="#476174" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="725.0" y="119.0" width="197.0" height="122" rx="10" fill="#f2f7fb" stroke="#476174" stroke-width="2"/>
<text x="823.5" y="175.0" font-size="22" text-anchor="middle" font-weight="650" fill="#17293a">HTTP response</text>
<text x="823.5" y="199.0" font-size="18" text-anchor="middle" font-weight="400" fill="#17293a">200 and page</text>
</g>
</svg>
