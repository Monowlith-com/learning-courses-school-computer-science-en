<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="title description" xml:lang="en">
<title id="title">Deciding seat availability</title>
<desc id="description">If no seats are available, the result is full. Otherwise a check for fewer than three leads to few if true and available if false.</desc>
<defs><marker id="arrow" orient="auto" markerWidth="8" markerHeight="7" refX="7.4" refY="3.5"><path d="M0 0 L8 3.5 L0 7 Z" fill="#476174"/></marker></defs>
<rect width="960" height="480" fill="#fff"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="38" y="57" font-size="31" text-anchor="start" font-weight="700" fill="#17293a">Deciding seat availability</text>
<path d="M38 77 H922" stroke="#bac5cf" stroke-width="1.4"/>
<path d="M405.0 152.0 Q517.0 152.0 629.0 152.0" fill="none" stroke="#476174" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="498.5" y="126.0" width="37" height="22" rx="4" fill="#fff"/>
<text x="517.0" y="142.0" font-size="17" text-anchor="middle" font-weight="400" fill="#17293a">yes</text>
<path d="M284.0 185.0 Q284.0 210.0 284.0 235.0" fill="none" stroke="#476174" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="270.0" y="184.0" width="28" height="22" rx="4" fill="#fff"/>
<text x="284.0" y="200.0" font-size="17" text-anchor="middle" font-weight="400" fill="#17293a">no</text>
<path d="M405.0 268.0 Q517.0 268.0 629.0 268.0" fill="none" stroke="#476174" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="498.5" y="242.0" width="37" height="22" rx="4" fill="#fff"/>
<text x="517.0" y="258.0" font-size="17" text-anchor="middle" font-weight="400" fill="#17293a">yes</text>
<path d="M284.0 301.0 Q284.0 325.0 284.0 349.0" fill="none" stroke="#476174" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="270.0" y="299.0" width="28" height="22" rx="4" fill="#fff"/>
<text x="284.0" y="315.0" font-size="17" text-anchor="middle" font-weight="400" fill="#17293a">no</text>
<rect x="163.0" y="119.0" width="242" height="66" rx="10" fill="#f2f7fb" stroke="#476174" stroke-width="2"/>
<text x="284" y="159.0" font-size="22" text-anchor="middle" font-weight="650" fill="#17293a">Exactly 0 seats?</text>
<rect x="629.0" y="119.0" width="178" height="66" rx="10" fill="#f2f7fb" stroke="#476174" stroke-width="2"/>
<text x="718" y="159.0" font-size="22" text-anchor="middle" font-weight="650" fill="#17293a">Full</text>
<rect x="163.0" y="235.0" width="242" height="66" rx="10" fill="#f2f7fb" stroke="#476174" stroke-width="2"/>
<text x="284" y="275.0" font-size="19" text-anchor="middle" font-weight="650" fill="#17293a">Fewer than 3 seats?</text>
<rect x="629.0" y="235.0" width="178" height="66" rx="10" fill="#f2f7fb" stroke="#476174" stroke-width="2"/>
<text x="718" y="275.0" font-size="22" text-anchor="middle" font-weight="650" fill="#17293a">Few</text>
<rect x="195.0" y="349.0" width="178" height="66" rx="10" fill="#f2f7fb" stroke="#476174" stroke-width="2"/>
<text x="284" y="389.0" font-size="22" text-anchor="middle" font-weight="650" fill="#17293a">Available</text>
</g>
