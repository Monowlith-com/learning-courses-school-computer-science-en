<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="title description" xml:lang="en">
<title id="title">Readings for the display and the network service</title>
<desc id="description">The sensing service reads the sensor and updates the reading store. The local display and network service read from it through separate paths. The network service does not control the display.</desc>
<defs><marker id="arrow" orient="auto" markerWidth="8" markerHeight="7" refX="7.4" refY="3.5"><path d="M0 0 L8 3.5 L0 7 Z" fill="#476174"/></marker></defs>
<rect width="960" height="480" fill="#fff"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="38" y="57" font-size="27" text-anchor="start" font-weight="700" fill="#17293a">Readings for the display and the network service</text>
<path d="M38 77 H922" stroke="#bac5cf" stroke-width="1.4"/>
<path d="M216.0 250.0 Q290.5 250.0 365.0 250.0" fill="none" stroke="#476174" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="258.5" y="224.0" width="64" height="22" rx="4" fill="#fff"/>
<text x="290.5" y="240.0" font-size="17" text-anchor="middle" font-weight="400" fill="#17293a">writes</text>
<path d="M555.0 220.3125 Q622.7 199.15625 690.4 178.0" fill="none" stroke="#476174" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="581.7" y="173.15625" width="82" height="22" rx="4" fill="#fff"/>
<text x="622.7" y="189.15625" font-size="17" text-anchor="middle" font-weight="400" fill="#17293a">Readings</text>
<path d="M555.0 279.6875 Q622.7 300.84375 690.4 322.0" fill="none" stroke="#476174" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="575.2" y="287.84375" width="127" height="22" rx="4" fill="#fff"/>
<text x="638.7" y="303.84375" font-size="17" text-anchor="middle" font-weight="400" fill="#17293a">Selected data</text>
<rect x="44.0" y="217.0" width="172" height="66" rx="10" fill="#f2f7fb" stroke="#476174" stroke-width="2"/>
<text x="130" y="245.0" font-size="16" text-anchor="middle" font-weight="650" fill="#17293a">Sensing service</text>
<text x="130" y="269.0" font-size="16" text-anchor="middle" font-weight="400" fill="#17293a">Read the sensor</text>
<rect x="365.0" y="217.0" width="190" height="66" rx="10" fill="#f2f7fb" stroke="#476174" stroke-width="2"/>
<text x="460" y="245.0" font-size="21" text-anchor="middle" font-weight="650" fill="#17293a">Reading store</text>
<text x="460" y="269.0" font-size="18" text-anchor="middle" font-weight="400" fill="#17293a">Value and time</text>
<rect x="689.0" y="112.0" width="214" height="66" rx="10" fill="#f2f7fb" stroke="#476174" stroke-width="2"/>
<text x="796" y="140.0" font-size="21" text-anchor="middle" font-weight="650" fill="#17293a">Display service</text>
<text x="796" y="164.0" font-size="18" text-anchor="middle" font-weight="400" fill="#17293a">Decide locally</text>
<rect x="689.0" y="322.0" width="214" height="66" rx="10" fill="#f2f7fb" stroke="#476174" stroke-width="2"/>
<text x="796" y="350.0" font-size="21" text-anchor="middle" font-weight="650" fill="#17293a">Network service</text>
<text x="796" y="374.0" font-size="18" text-anchor="middle" font-weight="400" fill="#17293a">Transmit readings</text>
