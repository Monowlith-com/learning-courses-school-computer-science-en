<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="title desc">
<title id="title">Missed watering recommendations</title>
<desc id="desc">Garden beds: 2 missed recommendations out of 10 actual positives, 20 percent. Balcony planters: 6 out of 40, 15 percent. Both bars start at zero.</desc>
<rect x="0" y="0" width="960" height="480" fill="#fff"/>
<g font-family="Arial, sans-serif">
<text x="52" y="62" font-size="34" text-anchor="start" fill="#122235" font-weight="700">Missed watering recommendations</text>
<line x1="52" y1="82" x2="908" y2="82" stroke="#aab6c0" stroke-width="2"/>
<text x="52" y="127" font-size="23" text-anchor="start" fill="#122235">Share of cases that actually needed watering</text>
<line x1="243" y1="158" x2="243" y2="350" stroke="#aab6c0" stroke-width="2"/>
<text x="243" y="384" font-size="20" text-anchor="middle" fill="#122235">0%</text>
<line x1="368" y1="158" x2="368" y2="350" stroke="#aab6c0" stroke-width="2"/>
<text x="368" y="384" font-size="20" text-anchor="middle" fill="#122235">5%</text>
<line x1="493" y1="158" x2="493" y2="350" stroke="#aab6c0" stroke-width="2"/>
<text x="493" y="384" font-size="20" text-anchor="middle" fill="#122235">10%</text>
<line x1="618" y1="158" x2="618" y2="350" stroke="#aab6c0" stroke-width="2"/>
<text x="618" y="384" font-size="20" text-anchor="middle" fill="#122235">15%</text>
<line x1="743" y1="158" x2="743" y2="350" stroke="#aab6c0" stroke-width="2"/>
<text x="743" y="384" font-size="20" text-anchor="middle" fill="#122235">20%</text>
<line x1="868" y1="158" x2="868" y2="350" stroke="#aab6c0" stroke-width="2"/>
<text x="868" y="384" font-size="20" text-anchor="middle" fill="#122235">25%</text>
<text x="225" y="209" font-size="22" text-anchor="end" fill="#122235" font-weight="700">Garden beds</text>
<rect x="243" y="175" width="500" height="51" fill="#235789"/>
<text x="257" y="209" font-size="22" text-anchor="start" fill="#fff" font-weight="700">2 / 10</text>
<text x="756" y="209" font-size="21" text-anchor="start" fill="#122235" font-weight="700">20%</text>
<text x="225" y="292" font-size="22" text-anchor="end" fill="#122235" font-weight="700">Balcony planters</text>
<rect x="243" y="258" width="375" height="51" fill="#27645c"/>
<text x="257" y="292" font-size="22" text-anchor="start" fill="#fff" font-weight="700">6 / 40</text>
<text x="631" y="292" font-size="21" text-anchor="start" fill="#122235" font-weight="700">15%</text>
<line x1="243" y1="350" x2="868" y2="350" stroke="#122235" stroke-width="2"/>
<text x="868" y="437" font-size="22" text-anchor="end" fill="#122235">False negative rate</text>
</g>
</svg>
