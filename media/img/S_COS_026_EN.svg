<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="image-title image-description">
<title id="image-title">Distance levels in breadth-first search</title>
<desc id="image-description">A is at level 0, B and C at level 1, D and E at level 2, and F at level 3. Solid edges join A with B and C, B with D, C with E, and D with F. Extra edges C–D and E–F are dashed. G is unreachable.</desc>
