<text x="129" y="185" font-size="20" text-anchor="end" font-weight="700">Bit</text>
<text x="129" y="244" font-size="20" text-anchor="end" font-weight="700">Contribution</text>
<text x="187" y="120" font-size="20" text-anchor="middle" font-weight="400">128</text>
