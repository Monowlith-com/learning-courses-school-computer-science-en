<text x="657" y="182" font-size="31" text-anchor="middle" font-weight="700">0</text>
<text x="657" y="244" font-size="20" text-anchor="middle" font-weight="400">0</text>
<text x="751" y="120" font-size="20" text-anchor="middle" font-weight="400">2</text>
