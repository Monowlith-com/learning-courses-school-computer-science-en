<text x="375" y="182" font-size="31" text-anchor="middle" font-weight="700">0</text>
<text x="375" y="244" font-size="20" text-anchor="middle" font-weight="400">0</text>
<text x="469" y="120" font-size="20" text-anchor="middle" font-weight="400">16</text>
<rect x="437" y="146" width="64" height="52" rx="7" fill="#fff" stroke="#476174" stroke-width="2"/>
<text x="469" y="182" font-size="31" text-anchor="middle" font-weight="700">0</text>
<text x="469" y="244" font-size="20" text-anchor="middle" font-weight="400">0</text>
<text x="563" y="120" font-size="20" text-anchor="middle" font-weight="400">8</text>
