<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="960" height="325" viewBox="0 0 960 325" role="img" aria-labelledby="image-title image-desc">
<title id="image-title">Place values in a byte</title>
<desc id="image-desc">From left to right the weights above the bits 0, 1, 0, 0, 1, 0, 1, 1 are 128, 64, 32, 16, 8, 4, 2 and 1. The contributing weights are 64, 8, 2 and 1.</desc>
