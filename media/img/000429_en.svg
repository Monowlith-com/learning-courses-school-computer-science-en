<text x="38" y="57" font-size="31" text-anchor="start" font-weight="700" fill="#17293a">Context of a temperature reading</text>
<path d="M38 77 H922" stroke="#bac5cf" stroke-width="1.4"/>
<rect x="38" y="111" width="884" height="45" fill="#dce8f1" stroke="#e2e9ef"/>
<text x="259.0" y="140" font-size="21" text-anchor="middle" font-weight="650" fill="#17293a">Information</text>
<path d="M480.0 111 v45" fill="none" stroke="#476174" stroke-width="2.4"/>
