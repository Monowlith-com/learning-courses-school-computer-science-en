<text x="701.0" y="185" font-size="21" text-anchor="middle" font-weight="400" fill="#17293a">21</text>
<rect x="38" y="201" width="884" height="45" fill="#f2f7fb" stroke="#e2e9ef"/>
<text x="259.0" y="230" font-size="21" text-anchor="middle" font-weight="400" fill="#17293a">Quantity</text>
<path d="M480.0 201 v45" fill="none" stroke="#476174" stroke-width="2.4"/>
<text x="701.0" y="230" font-size="21" text-anchor="middle" font-weight="400" fill="#17293a">Room temperature</text>
<rect x="38" y="246" width="884" height="45" fill="#fff" stroke="#e2e9ef"/>
<text x="259.0" y="275" font-size="21" text-anchor="middle" font-weight="400" fill="#17293a">Unit</text>
