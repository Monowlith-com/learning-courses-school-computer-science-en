<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 416" width="960" height="416" role="img" aria-labelledby="title description" xml:lang="en">
<title id="title">Context of a temperature reading</title>
<desc id="description">The raw value 21 denotes room temperature in degrees Celsius. It was recorded by instrument A at the window at 09:00 on 12 May.</desc>
<defs><marker id="arrow" orient="auto" markerWidth="8" markerHeight="7" refX="7.4" refY="3.5"><path d="M0 0 L8 3.5 L0 7 Z" fill="#476174"/></marker></defs>
