<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 371" width="960" height="371" role="img" aria-labelledby="title description" xml:lang="en">
<title id="title">Functional dependencies in a registration</title>
<desc id="description">Student ID determines the name, workshop ID determines the title and room ID, room ID determines the room name, and the student–workshop pair determines the registration date. Values then belong in student, workshop, room and registration.</desc>
