<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 370" width="700" height="370" role="img" aria-labelledby="desc"><title id="desc">Instruction sequence LOADI, ADD, STORE, HALT with PC, ACC and M[22] after each step.</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#42627a"/></marker></defs><rect width="700" height="370" fill="white"/><g font-family="Arial, sans-serif"><text x="350" y="34" font-size="23" text-anchor="middle" font-weight="bold" fill="#182d40">Register state after each instruction</text><rect x="25" y="63" width="650" height="43" rx="5" fill="#e8f1f8" stroke="#42627a" stroke-width="1.5"/><text x="73" y="91" font-size="17" text-anchor="middle" font-weight="bold" fill="#182d40">PC old</text><text x="218" y="91" font-size="17" text-anchor="middle" font-weight="bold" fill="#182d40">Instruction</text><text x="371" y="91" font-size="17" text-anchor="middle" font-weight="bold" fill="#182d40">PC new</text><text x="470" y="91" font-size="17" text-anchor="middle" font-weight="bold" fill="#182d40">ACC</text><text x="595" y="91" font-size="17" text-anchor="middle" font-weight="bold" fill="#182d40">M[22]</text><rect x="25" y="112" width="650" height="42" rx="5" fill="#f2f6f9" stroke="#42627a" stroke-width="1.5"/><text x="73" y="139" font-size="19" text-anchor="middle" font-weight="normal" fill="#182d40">0</text><text x="218" y="139" font-size="19" text-anchor="middle" font-weight="normal" fill="#182d40">LOADI 10</text><text x="371" y="139" font-size="19" text-anchor="middle" font-weight="normal" fill="#182d40">1</text><text x="470" y="139" font-size="19" text-anchor="middle" font-weight="normal" fill="#182d40">7</text><text x="595" y="139" font-size="19" text-anchor="middle" font-weight="normal" fill="#182d40">0</text><rect x="25" y="158" width="650" height="42" rx="5" fill="#f2f6f9" stroke="#42627a" stroke-width="1.5"/><text x="73" y="185" font-size="19" text-anchor="middle" font-weight="normal" fill="#182d40">1</text><text x="218" y="185" font-size="19" text-anchor="middle" font-weight="normal" fill="#182d40">ADD 21</text><text x="371" y="185" font-size="19" text-anchor="middle" font-weight="normal" fill="#182d40">2</text><text x="470" y="185" font-size="19" text-anchor="middle" font-weight="normal" fill="#182d40">12</text><text x="595" y="185" font-size="19" text-anchor="middle" font-weight="normal" fill="#182d40">0</text><rect x="25" y="204" width="650" height="42" rx="5" fill="#dceee1" stroke="#42627a" stroke-width="1.5"/><text x="73" y="231" font-size="19" text-anchor="middle" font-weight="normal" fill="#182d40">2</text><text x="218" y="231" font-size="19" text-anchor="middle" font-weight="normal" fill="#182d40">STORE 22</text><text x="371" y="231" font-size="19" text-anchor="middle" font-weight="normal" fill="#182d40">3</text><text x="470" y="231" font-size="19" text-anchor="middle" font-weight="normal" fill="#182d40">12</text><text x="595" y="231" font-size="19" text-anchor="middle" font-weight="normal" fill="#182d40">12</text><rect x="25" y="250" width="650" height="42" rx="5" fill="#f2f6f9" stroke="#42627a" stroke-width="1.5"/><text x="73" y="277" font-size="19" text-anchor="middle" font-weight="normal" fill="#182d40">3</text><text x="218" y="277" font-size="19" text-anchor="middle" font-weight="normal" fill="#182d40">HALT</text><text x="371" y="277" font-size="19" text-anchor="middle" font-weight="normal" fill="#182d40">4</text><text x="470" y="277" font-size="19" text-anchor="middle" font-weight="normal" fill="#182d40">12</text><text x="595" y="277" font-size="19" text-anchor="middle" font-weight="normal" fill="#182d40">12</text><text x="350" y="326" font-size="18" text-anchor="middle" font-weight="normal" fill="#182d40">M[10]=20; M[20]=7; M[21]=5</text><text x="350" y="353" font-size="16" text-anchor="middle" font-weight="normal" fill="#182d40">One step = one complete instruction.</text></g></svg>
