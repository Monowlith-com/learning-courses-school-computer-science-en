<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="title desc">
<title id="title">Comparing five waiting times</title>
<desc id="desc">Four points on the time scale are at 6, 7, 8 and 9 minutes, with another at 30. The median is 8 minutes and the mean is 12.</desc>
<rect x="0" y="0" width="960" height="480" fill="#fff"/>
<g font-family="Arial, sans-serif">
<text x="52" y="62" font-size="34" text-anchor="start" fill="#122235" font-weight="700">Comparing five waiting times</text>
<line x1="52" y1="82" x2="908" y2="82" stroke="#aab6c0" stroke-width="2"/>
<line x1="112" y1="294" x2="856" y2="294" stroke="#122235" stroke-width="2"/>
<line x1="400" y1="156" x2="400" y2="294" stroke="#235789" stroke-width="3" stroke-dasharray="8 6"/>
<text x="400" y="143" font-size="22" text-anchor="middle" fill="#122235" font-weight="700">Mean: 12 min</text>
<line x1="304" y1="228" x2="304" y2="365" stroke="#27645c" stroke-width="2"/>
<line x1="304" y1="365" x2="270" y2="365" stroke="#27645c" stroke-width="2"/>
<text x="259" y="372" font-size="22" text-anchor="end" fill="#122235" font-weight="700">Median: 8 min</text>
<line x1="112" y1="294" x2="112" y2="302" stroke="#122235" stroke-width="2"/>
<text x="112" y="329" font-size="20" text-anchor="middle" fill="#122235">0</text>
<line x1="232" y1="294" x2="232" y2="302" stroke="#122235" stroke-width="2"/>
<text x="232" y="329" font-size="20" text-anchor="middle" fill="#122235">5</text>
<line x1="352" y1="294" x2="352" y2="302" stroke="#122235" stroke-width="2"/>
<text x="352" y="329" font-size="20" text-anchor="middle" fill="#122235">10</text>
<line x1="472" y1="294" x2="472" y2="302" stroke="#122235" stroke-width="2"/>
<text x="472" y="329" font-size="20" text-anchor="middle" fill="#122235">15</text>
<line x1="592" y1="294" x2="592" y2="302" stroke="#122235" stroke-width="2"/>
<text x="592" y="329" font-size="20" text-anchor="middle" fill="#122235">20</text>
<line x1="712" y1="294" x2="712" y2="302" stroke="#122235" stroke-width="2"/>
<text x="712" y="329" font-size="20" text-anchor="middle" fill="#122235">25</text>
<line x1="832" y1="294" x2="832" y2="302" stroke="#122235" stroke-width="2"/>
<text x="832" y="329" font-size="20" text-anchor="middle" fill="#122235">30</text>
<text x="256" y="207" font-size="20" text-anchor="middle" fill="#122235">6</text>
<circle cx="256" cy="224" r="6" fill="#122235" stroke="#122235" stroke-width="3"/>
<text x="280" y="207" font-size="20" text-anchor="middle" fill="#122235">7</text>
<circle cx="280" cy="224" r="6" fill="#122235" stroke="#122235" stroke-width="3"/>
<text x="304" y="207" font-size="20" text-anchor="middle" fill="#122235">8</text>
<circle cx="304" cy="224" r="8" fill="#fff" stroke="#122235" stroke-width="3"/>
<text x="328" y="207" font-size="20" text-anchor="middle" fill="#122235">9</text>
<circle cx="328" cy="224" r="6" fill="#122235" stroke="#122235" stroke-width="3"/>
<text x="832" y="207" font-size="20" text-anchor="middle" fill="#122235">30</text>
<circle cx="832" cy="224" r="6" fill="#122235" stroke="#122235" stroke-width="3"/>
<text x="855" y="372" font-size="21" text-anchor="end" fill="#122235">Waiting time (min)</text>
</g>
</svg>
