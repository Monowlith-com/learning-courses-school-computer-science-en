<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 370" width="700" height="370" role="img" aria-labelledby="desc"><title id="desc">Full adder with three inputs, two outputs and all eight truth-table rows.</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#42627a"/></marker></defs><rect width="700" height="370" fill="white"/><g font-family="Arial, sans-serif"><text x="350" y="32" font-size="24" text-anchor="middle" font-weight="bold" fill="#182d40">Full adder</text><rect x="36" y="122" width="220" height="117" rx="5" fill="#e8f1f8" stroke="#42627a" stroke-width="1.5"/><text x="146" y="165" font-size="17" text-anchor="middle" font-weight="bold" fill="#182d40">s = a XOR b XOR cᵢₙ</text><text x="146" y="198" font-size="16" text-anchor="middle" font-weight="normal" fill="#182d40">cₒᵤₜ = ab + acᵢₙ + bcᵢₙ</text><text x="146" y="95" font-size="20" text-anchor="middle" font-weight="normal" fill="#182d40">a, b, cᵢₙ</text><text x="146" y="270" font-size="20" text-anchor="middle" font-weight="normal" fill="#182d40">s, cₒᵤₜ</text><path d="M146 100 V120" stroke="#42627a" stroke-width="2" marker-end="url(#arrow)"/><path d="M146 239 V256" stroke="#42627a" stroke-width="2" marker-end="url(#arrow)"/><rect x="303" y="49" width="350" height="34" rx="5" fill="#e8f1f8" stroke="#42627a" stroke-width="1.5"/><text x="331" y="72" font-size="18" text-anchor="middle" font-weight="bold" fill="#182d40">a</text><text x="391" y="72" font-size="18" text-anchor="middle" font-weight="bold" fill="#182d40">b</text><text x="451" y="72" font-size="18" text-anchor="middle" font-weight="bold" fill="#182d40">cᵢₙ</text><text x="541" y="72" font-size="18" text-anchor="middle" font-weight="bold" fill="#182d40">s</text><text x="621" y="72" font-size="18" text-anchor="middle" font-weight="bold" fill="#182d40">cₒᵤₜ</text><rect x="303" y="87" width="350" height="28" rx="5" fill="#ffffff" stroke="#42627a" stroke-width="1.5"/><tex